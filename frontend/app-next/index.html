<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efeae0" />
    <title>DEGEN</title>
    <script>
      // Phone only (Lorenzo, 21/10: "versione desktop non cambiarla").
      if (matchMedia("(min-width: 1100px)").matches) location.replace("/onchain-app.html" + location.hash);
      // The theme picked in Profile (theme.js, "lae:theme"), before the first paint.
      try {
        var t = localStorage.getItem("lae:theme");
        if (t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#111513";
        }
      } catch (e) {}
    </script>
    <!--onchain-boot-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
