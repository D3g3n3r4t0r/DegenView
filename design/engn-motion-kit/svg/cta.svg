<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" class="s-cta" role="img" aria-labelledby="engn-cta-title"><title id="engn-cta-title">Activate engine</title><style>
svg{--mint:var(--engn-accent,#2de2b0);--dim:var(--engn-muted,#49605d);--alert:var(--engn-warning,#eabb69);--bad:var(--engn-error,#ef827f);overflow:visible}
.top{fill:#252d33;stroke:#35413f}.left{fill:#0b1115;stroke:#293533}.right{fill:#0e191b;stroke:#2b3e39}.facet{stroke-width:.7;stroke-linejoin:round}.outline{fill:none;stroke:var(--mint);stroke-width:1;opacity:.13}.band{fill:none;stroke:var(--mint);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.halo{stroke-width:9;opacity:.12}.ground{fill:none;stroke:var(--dim);opacity:.16;stroke-width:.7}.ring{fill:none;stroke:var(--mint);stroke-width:1;opacity:.2}.orbit{transform-origin:160px 158px}.module{transform-box:fill-box;transform-origin:center;animation:assemble 3s both;animation-delay:0s}.face{transform-origin:160px 155px}.scanline{stroke:var(--mint);stroke-width:2;opacity:0}.signal{fill:var(--mint)}.badge{fill:#0b1516;stroke:var(--mint);stroke-width:1.3}.mark{fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.status-mark{transform-origin:225px 215px}.pulse{fill:none;stroke:var(--mint);opacity:0}.arc{fill:none;stroke:var(--mint);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:160px 158px}.track{fill:none;stroke:var(--dim);stroke-width:2;opacity:.22}.label{fill:var(--mint);font:11px monospace;text-anchor:middle}.s-assemble .solid{animation:reveal 3s both}.s-assemble .modules{animation:hideModules 3s both}.s-assemble .band{animation:ignite 3s both}.s-idle .face{animation:breathe 4.8s ease-in-out infinite}.s-idle .band{animation:glow 4.8s ease-in-out infinite}.s-scan .scanline{animation:scan 2.4s ease-in-out infinite}.s-scan .signal{animation:blip 2.4s infinite}.s-loading .orbit{animation:spin 1.6s linear infinite}.s-loading .band{animation:glow 1.6s ease-in-out infinite}.s-success .status-mark{animation:confirm .7s both}.s-success .pulse{animation:ripple .7s both}.s-warning{--mint:var(--alert)}.s-warning .status-mark{animation:confirm .9s both}.s-error{--mint:var(--bad)}.s-error .face{animation:nudge .5s both}.s-empty .band{stroke:var(--dim);opacity:.45}.s-empty .face{opacity:.55}.s-reconnect .link-dot{animation:connect 2.2s ease-in-out infinite;animation-delay:var(--delay)}.s-cta .face{animation:activate .85s both}.s-cta .band{animation:glow .85s both}.s-transition .face{animation:handoff .9s both}.paused *{animation-play-state:paused!important}
@keyframes assemble{0%,10%{transform:translate(var(--dx),var(--dy));opacity:.85}60%,100%{transform:translate(0,0);opacity:1}}
@keyframes reveal{0%,59%{opacity:0}64%,100%{opacity:1}}@keyframes hideModules{0%,59%{opacity:1}64%,100%{opacity:0}}
@keyframes ignite{0%,58%{opacity:0}68%{opacity:1;stroke-width:4}82%,100%{opacity:1;stroke-width:2.7}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(-46px);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateY(48px);opacity:0}}
@keyframes blip{0%,60%,100%{opacity:.15}70%,80%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confirm{0%{transform:scale(.75);opacity:0}65%,100%{transform:scale(1);opacity:1}}@keyframes ripple{0%{r:26;opacity:.6}100%{r:46;opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@keyframes connect{0%,100%{opacity:.12}50%{opacity:1}}@keyframes activate{0%{transform:translateY(0)}60%,100%{transform:translateY(-5px)}}
@keyframes handoff{0%{transform:translateX(-12px);opacity:0}100%{transform:translateX(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.s-assemble .modules{display:none}.s-assemble .solid{opacity:1}.s-scan .scanline{opacity:.65}.status-mark{opacity:1}.link-dot{opacity:.55}.face{transform:none!important}.pulse{display:none}}
</style><defs><clipPath id="engn-cta-clip"><path d="M160 70 230 108V185L160 223 90 185V108Z"/></clipPath></defs><path class="ground" d="M61 221 160 275 259 221M80 231 179 177M107 246 206 192M134 260 233 207"/><g class="face"><g class="solid"><path class="facet top" d="M160 70 230 108 160 146 90 108Z"/><path class="facet left" d="M90 108 160 146 160 223 90 185Z"/><path class="facet right" d="M160 146 230 108 230 185 160 223Z"/></g><path class="band halo" d="M92 150 160 187 228 150"/><path class="band" d="M92 150 160 187 228 150"/><path class="mark" style="stroke-width:1.5" d="M252 145h24m-7-7 7 7-7 7"/></g></svg>