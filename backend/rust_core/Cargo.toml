[package]
name = "degenview_rs"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency native Rust SIMD & multi-core quant engine for DegenView"

[lib]
name = "degenview_rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
