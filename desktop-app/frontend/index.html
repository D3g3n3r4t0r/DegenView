<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Liquidity Analysis Engine</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1012; color: #e6e8ee;
    font-family: "Courier New", monospace; font-size: 13px;
  }
  .cursor { display: inline-block; width: 7px; height: 13px; background: #e0c87a; margin-left: 4px; animation: blink 1.1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  #msg { color: #82868f; font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
  <div style="text-align:center;">
    <div>$ avvio motore di analisi<span class="cursor"></span></div>
    <div id="msg">in ascolto su 127.0.0.1:8000 — la finestra passa da sola al grafico</div>
  </div>
</body>
</html>
