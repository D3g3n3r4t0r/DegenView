# Fly.io — Liquidity Analysis Engine
# Deploy: flyctl deploy  (o automatico via GitHub Actions)

app = "liquidity-analysis-engine"
primary_region = "ams"   # Amsterdam — più vicino all'Italia

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0      # scala a zero di notte (free tier)

  # WebSocket keepalive
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent 1GB volume for watchlist + uploaded Pine scripts — without this,
# that data lives only in the container's writable layer and is wiped on
# every deploy. Volumes attach to a single machine, so this app intentionally
# runs as one instance (see the machine-count note in README/deploy notes).
[[mounts]]
  source = "data"
  destination = "/srv/backend/data"
