# fly.toml app configuration file generated for degen-hub on 2026-09-02T09:24:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'degen-hub'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'data'
  destination = '/srv/backend/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
