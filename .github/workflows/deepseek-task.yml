# DeepSeek as a coding worker (.github/scripts/deepseek_task.py): an issue
# labelled `deepseek` becomes a pull request that Claude reviews and merges.
# Generated code runs (checks) in a step with no GitHub token; the step
# that pushes runs none of it. Nothing merges automatically.
name: DeepSeek task

# Off since 20/10 (Lorenzo: "considera DeepSeek ad oggi come se non
# esistesse"): DeepSeek is paid. Started by hand only, and it needs the
# DEEPSEEK_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: deepseek-task-${{ github.event.issue.number }}

jobs:
  work:
    if: github.event.label.name == 'deepseek'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r backend/requirements.txt ruff pytest
      - name: Generate and check (DeepSeek key only)
        run: python .github/scripts/deepseek_task.py generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      - name: Publish the pull request (GitHub token only)
        run: python .github/scripts/deepseek_task.py publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
