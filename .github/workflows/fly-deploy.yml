name: Deploy to Fly.io

on:
  push:
    branches: [main]          # deploy automatico ad ogni push su main
  workflow_dispatch:          # deploy manuale dal tab "Actions" di GitHub

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend
        run: |
          pip install ruff
          ruff check backend/ --select E,F,W --ignore E501

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    concurrency: deploy-group  # un deploy alla volta

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Il builder remoto di Fly ogni tanto risponde 403 "internal error" prima
      # ancora di costruire: non e' il nostro codice, e riprovare subito
      # funziona. Senza questo, un guasto loro lasciava la produzione indietro
      # di un commit finche' qualcuno non se ne accorgeva.
      - name: Deploy
        run: |
          for attempt in 1 2 3; do
            if flyctl deploy --remote-only; then
              exit 0
            fi
            echo "tentativo $attempt fallito; riprovo fra 30s"
            sleep 30
          done
          echo "tre tentativi falliti"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
