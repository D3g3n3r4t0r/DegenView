name: Deploy to Fly.io

on:
  push:
    branches: [main]          # deploy automatico ad ogni push su main
  workflow_dispatch:          # deploy manuale dal tab "Actions" di GitHub

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend
        run: |
          pip install ruff
          ruff check backend/ --select E,F,W --ignore E501

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    concurrency: deploy-group  # un deploy alla volta

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
