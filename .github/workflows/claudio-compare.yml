name: Claudio 4H vs RSI+BB 4H

# Real 4h candles, last 12 months unseen by both searches. Runs when the
# comparison script or the strategy changes; results as notices.
on:
  push:
    branches: [main]
    paths:
      - scripts/compare_claudio.py
      - .github/workflows/claudio-compare.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && PYTHONPATH=. python ../scripts/compare_claudio.py
