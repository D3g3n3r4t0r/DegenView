name: Claudio 4H, every year as the unseen one

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'JSON list of pairs (empty = the 15 of the basket)'
        required: false
        default: ''
      tf:
        description: '4h or 1d'
        required: false
        default: '4h'
      set:
        description: 'variant set (empty = default, btc = every strategy with and without the BTC filter)'
        required: false
        default: ''
      filters:
        description: 'SET=regimes only: comma-separated filter suffixes to run (e.g. " w21x")'
        required: false
        default: ''

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 4 large caps, 5 around rank 150-250, 6 around 300-490 (rank printed
        # by the job, CoinPaprika)
        pair: ${{ fromJSON(inputs.pairs || '["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","COMPUSDT","BATUSDT","1INCHUSDT","KSMUSDT","SNXUSDT","ROSEUSDT","ZILUSDT","ANKRUSDT","CELOUSDT","IOTXUSDT","KAVAUSDT"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: cd backend && PAIR=${{ matrix.pair }} TF=${{ inputs.tf || '4h' }} SET=${{ inputs.set }} FILTERS="${{ inputs.filters }}" PYTHONPATH=. python ../scripts/compare_claudio_folds.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folds-${{ matrix.pair }}
          path: backend/folds-*.json
          if-no-files-found: ignore
